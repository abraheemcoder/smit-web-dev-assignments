<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Food Menu Application</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- logo-section -->
        <div class="logo-container">
            <img src="Images/logo.png" alt="Website-logo">
        </div>

        <!-- Tabs-and-search-section -->
        <div class="tabs-search-container">
            <div class="tabs-container">
                <button>All</button>
                <button>Fast Food</button>
                <button>Desserts</button>
                <button>Soft Drinks</button>
            </div>
            <div class="search-container">
                <input type="text" id="" placeholder="Search here...">
                <button>Seacrh</button>
            </div>
        </div>

        <!-- Food-cards-section -->
        <div class="food-cards-container">
            <div class="food-card">
                <img src="" alt="" id="food-image">
                <h2 id="food-title"></h2>
                <p id="food-description"></p>
                <p id="food-price">Price: Rs.100</p>
                <button id="food-order-btn">Order</button>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
